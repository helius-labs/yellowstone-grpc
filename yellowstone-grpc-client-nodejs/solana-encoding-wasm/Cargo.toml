[package]
name = "yellowstone-grpc-solana-encoding-wasm"
version = "3.0.0"
authors = ["Triton One"]
edition = "2021"
homepage = "https://triton.one"
repository = "https://github.com/rpcpool/yellowstone-grpc"
license = "Apache-2.0"
keywords = ["solana"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.86"
# Must match the path proto's convert_from return types.
solana-transaction-status = "4.1.2"
wasm-bindgen = "0.2.100"
yellowstone-grpc-proto = { path = "../../yellowstone-grpc-proto", version = "9.0.0", default-features = false, features = ["convert"] }

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
lto = true
codegen-units = 1
